[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anythingllm-mcp"
version = "0.1.0"
description = "MCP server exposing an AnythingLLM workspace over Streamable HTTP"
requires-python = ">=3.11"

dependencies = [
    "mcp==2.0.0",
    "httpx>=0.27",
]

[project.scripts]
anythingllm-mcp = "anythingllm_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
