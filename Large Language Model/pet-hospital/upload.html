<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AnythingLLM 文档上传</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; max-width: 560px; margin: 60px auto; padding: 0 20px; }
  h1 { font-size: 20px; }
  button { padding: 8px 20px; margin-left: 8px; cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  #status { margin-top: 20px; white-space: pre-wrap; line-height: 1.6; }
  .err { color: #c00; }
  .ok { color: #080; }
</style>
</head>
<body>
<h1>上传文档到 AnythingLLM 第一个工作区</h1>
<p>
  <input type="file" id="file">
  <button id="btn">上传并嵌入</button>
</p>
<div id="status"></div>

<script>
const API = "http://localhost:3001/api/v1";
// 在 AnythingLLM 后台 Settings → API Keys 生成后填入
const KEY = "在此填入你的_API_KEY";
const AUTH = { "Authorization": "Bearer " + KEY };

const $file = document.getElementById("file");
const $btn = document.getElementById("btn");
const $status = document.getElementById("status");

function show(msg, cls) {
  $status.className = cls || "";
  $status.textContent = msg;
}

$btn.onclick = async () => {
  if (!$file.files[0]) return show("请先选择一个文件", "err");
  $btn.disabled = true;
  try {
    show("正在获取工作区列表…");
    const res = await fetch(API + "/workspaces", { headers: AUTH });
    const data = await res.json();
    if (!res.ok || !data.workspaces || !data.workspaces.length)
      throw new Error("获取工作区失败：" + JSON.stringify(data));

    const ws = data.workspaces[0];
    show("目标工作区：" + (ws.name || ws.slug) + "\n正在上传并向量化嵌入…");

    const fd = new FormData();
    fd.append("file", $file.files[0]);
    fd.append("addToWorkspaces", ws.slug);

    const up = await fetch(API + "/document/upload", { method: "POST", headers: AUTH, body: fd });
    const out = await up.json();
    if (!up.ok || out.success === false)
      throw new Error("上传失败：" + (out.error || JSON.stringify(out)));

    show("✅ 上传并嵌入成功！\n工作区：" + (ws.name || ws.slug) +
         "\n文档：" + out.documents.map(d => d.title).join(", "), "ok");
  } catch (e) {
    show("❌ " + e.message + "\n（请确认 AnythingLLM 已启动且监听 3001 端口）", "err");
  } finally {
    $btn.disabled = false;
  }
};
</script>
</body>
</html>
